name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Build and run the full test suite (`make test` also builds and runs the
  # f64 gradient check) with the strict warning set promoted to errors, then
  # compile every example the same way.
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (warnings as errors)
        run: make ERR=1 test
      - name: Build the examples (warnings as errors)
        run: make clean && make ERR=1 examples

  # AddressSanitizer + UndefinedBehaviorSanitizer run over every test binary.
  sanitizers:
    name: ASAN/UBSAN (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanitizer build and tests
        run: make asan

  # The SIMD kernels are cross-checked against the scalar reference inside
  # test_mat, but also build the whole library with the scalar backend forced to
  # make sure the fallback path compiles and the dispatcher is still correct.
  scalar-kernels:
    name: scalar kernels (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scalar-backend build and math tests
        run: make ERR=1 EXTRA_CFLAGS=-DRL_SIMD_BACKEND=0 test_mat && ./test_mat

  # With RL_LIB_USE_BLAS the MatMul dispatcher hands the four transpose cases to
  # CBLAS instead of the SIMD/scalar kernels. test_mat then checks BLAS against
  # the scalar reference and every other suite exercises the BLAS path; the
  # build links the runner's OpenBLAS, whose pkg-config file carries the
  # version-specific include directory.
  system-blas:
    name: system BLAS (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config
      - name: Build and test with BLAS
        run: make ERR=1 BLAS=1 BLAS_CFLAGS="$(pkg-config --cflags openblas)" BLAS_LIBS="$(pkg-config --libs openblas)" test

  # Every suite is also run in double precision (RL_LIB_USE_DOUBLE), so f64 is
  # not only exercised by the gradient check. The tests build into their own
  # object tree, so this does not touch the default f32 objects. The f64
  # benchmark then compiles and runs the f64 AVX2 kernels, which no other job
  # reaches.
  double-precision:
    name: f64 suites (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run every suite in f64
        run: make ERR=1 test-double
      - name: f64 MatMul throughput
        run: make ERR=1 bench-double

  # The suites are also run instrumented, so the summary shows which lines of
  # the library and the environments the tests actually reach. Nothing is
  # asserted on the percentages; the value is the report itself, in the log.
  coverage:
    name: coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr
      - name: Build and run every suite with coverage
        run: make ERR=1 COVERAGE=1 test
      - name: Summarise
        run: gcovr --root . --filter src/ --filter envs/ --print-summary

  # The full multi-seed harness is far too slow to gate a pull request on, but
  # publishing its output keeps the README's tables reviewable against a real
  # run. The job asserts nothing about the numbers.
  benchmarks:
    name: benchmarks (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Multi-seed benchmarks + throughput
        run: make ERR=1 bench
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench_results.md

  # The threaded VecEnv pool is the only concurrent code in the library, so it
  # gets a ThreadSanitizer run of the two suites that drive it (they compare the
  # threaded trajectories against the serial ones field by field).
  threads:
    name: TSan (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer build and threaded suites
        run: make tsan

  # The serial-only configuration: no pthreads at all, so the threaded VecEnv
  # comparisons skip themselves instead of aborting the suites. Documented in
  # the Makefile header, and what a user who cannot link a thread library
  # builds (`cmake -DRL_LIB_NO_THREADS=ON` is the CMake equivalent).
  serial-only:
    name: no threads (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test without threads
        run: make ERR=1 EXTRA_CFLAGS=-DRL_LIB_NO_THREADS THREAD_FLAGS= test

  # Windows has no make toolchain in the default image, so this is the CMake
  # path: MSVC builds the library, the examples and the suites, and ctest runs
  # them - in f32 and in f64. It is also the only job that exercises the
  # Windows-only branches - Win32 threads in the VecEnv pool, _aligned_malloc,
  # the QueryPerformanceCounter bench clock - and the only MSVC build.
  windows:
    name: Windows (MSVC, cmake)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run the test suites
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Configure, build and test in f64
        run: |
          cmake -S . -B build-double -DCMAKE_BUILD_TYPE=Release -DRL_LIB_USE_DOUBLE=ON
          cmake --build build-double --config Release --parallel
          ctest --test-dir build-double -C Release --output-on-failure
      - name: Install into a scratch prefix
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/prefix"
      - name: Consume the install from a CMake project
        shell: bash
        run: |
          # RUNNER_TEMP / GITHUB_WORKSPACE arrive as native Windows paths with
          # backslashes, which bash cannot execute; normalize them first.
          T="$(cygpath -u "$RUNNER_TEMP")"
          W="$(cygpath -u "$GITHUB_WORKSPACE")"
          C="$T/consumer"
          mkdir -p "$C"
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.20)' \
            'project(rl_consumer C)' \
            'find_package(RL_lib-in-C REQUIRED)' \
            'add_executable(hello_static "${HELLO_SRC}")' \
            'target_link_libraries(hello_static PRIVATE RL_lib-in-C::rl_lib)' \
            'add_executable(hello_shared "${HELLO_SRC}")' \
            'target_link_libraries(hello_shared PRIVATE RL_lib-in-C::rl_lib_shared)' \
            'get_target_property(_implib RL_lib-in-C::rl_lib IMPORTED_IMPLIB_RELEASE)' \
            'get_target_property(_loc RL_lib-in-C::rl_lib IMPORTED_LOCATION_RELEASE)' \
            'message(STATUS "RL_lib-in-C::rl_lib (Release) implib=${_implib} location=${_loc}")' \
            > "$C/CMakeLists.txt"
          cmake -S "$C" -B "$C/build" \
            -DHELLO_SRC="$W/examples/hello_rl.c" \
            -DCMAKE_PREFIX_PATH="$T/prefix"
          cmake --build "$C/build" --config Release
          # The static consumer needs nothing beside it.
          "$C/build/Release/hello_static.exe"
          # The shared one needs the DLL: next to the executable, or on PATH.
          # Also checks that WINDOWS_EXPORT_ALL_SYMBOLS produced a usable .def.
          cp "$T/prefix/bin/rl_lib.dll" "$C/build/Release/"
          "$C/build/Release/hello_shared.exe"

  # Proves the packaged library works outside the source tree: install into a
  # scratch prefix, then compile and run examples/hello_rl.c against only the
  # installed headers and librl_lib, discovered through pkg-config.
  install-smoke:
    name: install & consume (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install into a scratch prefix
        run: make ERR=1 install PREFIX="$RUNNER_TEMP/prefix"
      - name: Build and run a consumer via pkg-config
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/prefix/lib/pkgconfig
        run: |
          echo "cflags: $(pkg-config --cflags rl_lib)"
          echo "libs:   $(pkg-config --libs rl_lib)"
          cc -O2 -Wall -Wextra -Werror $(pkg-config --cflags rl_lib) \
             examples/hello_rl.c $(pkg-config --libs rl_lib) -o "$RUNNER_TEMP/hello_shared"
          LD_LIBRARY_PATH="$RUNNER_TEMP/prefix/lib" "$RUNNER_TEMP/hello_shared"
      - name: Drive the installed shared library from Python (ctypes)
        run: python3 examples/python/ctypes_demo.py "$RUNNER_TEMP/prefix/lib/librl_lib.so"
      - name: Build and run a consumer against the static archive
        run: |
          cc -O2 -Wall -Wextra -Werror -I"$RUNNER_TEMP/prefix/include/rl_lib" \
             examples/hello_rl.c "$RUNNER_TEMP/prefix/lib/librl_lib.a" -lm \
             -pthread -o "$RUNNER_TEMP/hello_static"
          "$RUNNER_TEMP/hello_static"
      - name: Uninstall removes everything it installed
        run: |
          make uninstall PREFIX="$RUNNER_TEMP/prefix"
          test ! -e "$RUNNER_TEMP/prefix/include/rl_lib"
          test ! -e "$RUNNER_TEMP/prefix/lib/librl_lib.a"
          test ! -e "$RUNNER_TEMP/prefix/lib/pkgconfig/rl_lib.pc"
